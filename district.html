<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Район — Softskillград</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .d-hero {
      position: relative; z-index: 5;
      text-align: center; padding: 32px 20px 28px;
    }
    .d-emoji { font-size: 4rem; display: block; margin-bottom: 10px; animation: float 3s ease-in-out infinite; }
    .d-hero h1 { font-size: 1.8rem; font-weight: 900; margin-bottom: 6px; }
    .d-hero .sub { font-size: .9rem; color: var(--text3); margin-bottom: 20px; }

    .char-card {
      display: inline-flex; align-items: center; gap: 14px;
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: 18px; padding: 14px 20px;
      max-width: 480px; width: 100%;
      box-shadow: 0 4px 18px var(--shadow);
      text-align: left;
    }
    .char-av { font-size: 2.2rem; flex-shrink: 0; }
    .char-name { font-size: 1rem; font-weight: 900; color: var(--text); }
    .char-role { font-size: .78rem; color: var(--text3); margin-top: 2px; }
    .char-q { font-size: .83rem; color: var(--text2); margin-top: 6px; line-height: 1.4; font-style: italic; }

    .skills-wrap { max-width: 860px; margin: 0 auto; padding: 0 16px 60px; position: relative; z-index: 5; }
    .skills-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); gap: 16px; }

    .skill-card {
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: 20px; padding: 20px 18px;
      text-decoration: none; color: var(--text);
      transition: .25s; display: flex; flex-direction: column; gap: 10px;
      box-shadow: 0 3px 14px var(--shadow);
      animation: fadeUp .4s ease both;
    }
    .skill-card:hover { transform: translateY(-4px); box-shadow: 0 8px 28px var(--shadow2); }
    .sk-top { display: flex; align-items: center; gap: 10px; }
    .sk-emoji { font-size: 1.8rem; }
    .sk-name { font-size: 1rem; font-weight: 800; }
    .sk-desc { font-size: .8rem; color: var(--text3); line-height: 1.5; }
    .sk-footer { display: flex; align-items: center; justify-content: space-between; }
    .sk-pct { font-size: .8rem; font-weight: 800; }
    .sk-badge { font-size: .72rem; padding: 3px 10px; border-radius: 8px; font-weight: 700; }
    .badge-new  { background: var(--bg2); color: var(--text3); }
    .badge-prog { background: var(--yellow-light); color: #8a6a10; }
    .badge-done { background: var(--sage-light); color: #3a7a55; }
  </style>
</head>
<body>

<div class="bg-deco">
  <div class="bg-blob blob1"></div>
  <div class="bg-blob blob2"></div>
  <div class="bg-blob blob3"></div>
</div>

<header>
  <a href="index.html" class="back-btn">← Главная</a>
  <span class="header-title" id="headerTitle"></span>
</header>

<div class="d-hero" id="dHero"></div>

<div class="skills-wrap">
  <div class="section-label">Навыки района</div>
  <div class="skills-grid" id="skillsGrid"></div>
</div>

<script>
const ACCENTS = { communication:'#f4956a', leadership:'#7ab893', creative:'#b8a9d9', personal:'#7ec8e3' };
const BGLIGHTS = { communication:'#fde9dc', leadership:'#e8f5ee', creative:'#ece8f8', personal:'#dff2fa' };
const districtId = new URLSearchParams(location.search).get('id');

async function init(){
  const res = await fetch('data/skills.json');
  const data = await res.json();
  const d = data.districts.find(x=>x.id===districtId);
  if(!d){location.href='index.html';return;}
  document.title = d.name+' — Softskillград';
  renderHero(d);
  renderSkills(d);
}

function renderHero(d){
  const accent = ACCENTS[d.id]||'#7ab893';
  document.getElementById('headerTitle').textContent = d.emoji+' '+d.name;
  document.getElementById('dHero').innerHTML=`
    <span class="d-emoji">${d.emoji}</span>
    <h1 style="color:${accent}">${d.name}</h1>
    <p class="sub">Тренер: <strong>${d.character.name}</strong></p>
    <div class="char-card">
      <span class="char-av">${d.character.avatar}</span>
      <div>
        <div class="char-name">${d.character.name} <span style="font-weight:500;font-size:.8rem;color:var(--text3)">· ${d.character.role}</span></div>
        <div class="char-q">«${d.character.intro.split('.')[0]}.»</div>
      </div>
    </div>
  `;
}

function renderSkills(d){
  const accent = ACCENTS[d.id]||'#7ab893';
  const bgLight = BGLIGHTS[d.id]||'#e8f5ee';
  const grid = document.getElementById('skillsGrid');
  d.skills.forEach((sk,i)=>{
    const pct = +(localStorage.getItem(`ssg_skill_${sk.id}`)||0);
    let badge,bClass;
    if(pct===0){badge='Новый';bClass='badge-new';}
    else if(pct>=100){badge='✅ Прокачан';bClass='badge-done';}
    else{badge='В процессе';bClass='badge-prog';}

    const card=document.createElement('a');
    card.className='skill-card';
    card.href=`skill.html?id=${sk.id}&district=${d.id}`;
    card.style.animationDelay=i*.08+'s';
    card.innerHTML=`
      <div class="sk-top"><span class="sk-emoji">${sk.emoji}</span><span class="sk-name">${sk.name}</span></div>
      <div class="sk-desc">${sk.desc}</div>
      <div class="pbar-wrap"><div class="pbar-fill" style="width:${pct}%;background:${accent}"></div></div>
      <div class="sk-footer">
        <span class="sk-pct" style="color:${accent}">${pct}%</span>
        <span class="sk-badge ${bClass}">${badge}</span>
      </div>
    `;
    card.addEventListener('mouseenter',()=>{card.style.background=bgLight;card.style.borderColor=accent;});
    card.addEventListener('mouseleave',()=>{card.style.background='';card.style.borderColor='';});
    grid.appendChild(card);
  });
}

init();
</script>
</body>
</html>
