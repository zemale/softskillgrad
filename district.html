<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Район — Softskillград</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);font-family:'Nunito',sans-serif;color:#fff;overflow-x:hidden;}
    .stars{position:fixed;inset:0;pointer-events:none;z-index:0;}
    .star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--d,3s) infinite var(--delay,0s) ease-in-out;}
    @keyframes twinkle{0%,100%{opacity:.1}50%{opacity:.8}}

    header{position:relative;z-index:10;display:flex;align-items:center;gap:14px;padding:18px 24px;}
    .back-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:12px;padding:8px 16px;font-size:.9rem;font-weight:700;text-decoration:none;transition:.2s;}
    .back-btn:hover{background:rgba(255,255,255,.18);}

    /* District hero */
    .d-hero{
      position:relative;z-index:5;text-align:center;padding:24px 20px 32px;
    }
    .d-emoji{font-size:4rem;display:block;margin-bottom:12px;animation:float 3s ease-in-out infinite;}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    .d-hero h1{font-size:1.8rem;font-weight:900;margin-bottom:6px;}
    .d-hero .subtitle{font-size:.9rem;color:rgba(255,255,255,.55);margin-bottom:20px;}

    /* Character card */
    .character-card{
      display:inline-flex;align-items:center;gap:16px;
      background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
      border-radius:20px;padding:16px 24px;margin-bottom:8px;max-width:500px;width:100%;
    }
    .char-avatar{font-size:2.5rem;flex-shrink:0;}
    .char-info{text-align:left;}
    .char-name{font-size:1rem;font-weight:900;}
    .char-role{font-size:.8rem;color:rgba(255,255,255,.5);}
    .char-quote{font-size:.85rem;color:rgba(255,255,255,.7);margin-top:4px;line-height:1.4;font-style:italic;}

    /* Skills grid */
    .skills-wrap{max-width:860px;margin:0 auto;padding:0 16px 60px;}
    .skills-title{font-size:1.1rem;font-weight:800;margin-bottom:16px;opacity:.7;text-transform:uppercase;letter-spacing:.5px;}
    .skills-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;}

    .skill-card{
      background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.1);
      border-radius:20px;padding:22px 18px;text-decoration:none;color:#fff;
      transition:.25s;display:flex;flex-direction:column;gap:10px;
      animation:fadeUp .5s ease both;
    }
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .skill-card:hover{transform:translateY(-4px);}
    .skill-card .sk-top{display:flex;align-items:center;gap:10px;}
    .skill-card .sk-emoji{font-size:1.8rem;}
    .skill-card .sk-name{font-size:1rem;font-weight:800;}
    .skill-card .sk-desc{font-size:.8rem;color:rgba(255,255,255,.55);line-height:1.5;}
    .skill-card .sk-bar-wrap{height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;}
    .skill-card .sk-bar-fill{height:100%;border-radius:3px;transition:width .5s;}
    .skill-card .sk-footer{display:flex;align-items:center;justify-content:space-between;}
    .skill-card .sk-pct{font-size:.78rem;font-weight:700;}
    .skill-card .sk-badge{font-size:.72rem;padding:3px 10px;border-radius:8px;font-weight:700;}
    .badge-new{background:rgba(255,255,255,.08);color:rgba(255,255,255,.4);}
    .badge-progress{background:rgba(255,215,0,.15);color:#FFD700;}
    .badge-done{background:rgba(77,255,154,.15);color:#4dff9a;}
  </style>
</head>
<body>

<div class="stars" id="stars"></div>

<header>
  <a href="index.html" class="back-btn">← Главная</a>
  <span id="headerTitle" style="font-size:1.1rem;font-weight:800;"></span>
</header>

<div class="d-hero" id="districtHero"></div>

<div class="skills-wrap">
  <div class="skills-title">Навыки района</div>
  <div class="skills-grid" id="skillsGrid"></div>
</div>

<script>
(function(){const c=document.getElementById('stars');for(let i=0;i<60;i++){const s=document.createElement('div');s.className='star';const sz=Math.random()*3+1;s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;--delay:${Math.random()*4}s;opacity:${Math.random()*.7}`;c.appendChild(s);}})();

const params = new URLSearchParams(location.search);
const distId = params.get('id');

async function init(){
  const res = await fetch('data/skills.json');
  const data = await res.json();
  const district = data.districts.find(d=>d.id===distId);
  if(!district){location.href='index.html';return;}

  document.title = district.name + ' — Softskillград';
  document.getElementById('headerTitle').textContent = district.emoji + ' ' + district.name;
  renderHero(district);
  renderSkills(district);
}

function renderHero(d){
  const hero = document.getElementById('districtHero');
  hero.style.cssText += `;--color:${d.color}`;
  hero.innerHTML = `
    <span class="d-emoji">${d.emoji}</span>
    <h1 style="color:${d.color}">${d.name}</h1>
    <p class="subtitle">Персональный тренер: ${d.character.name}</p>
    <div class="character-card" style="border-color:${d.colorBorder}">
      <span class="char-avatar">${d.character.avatar}</span>
      <div class="char-info">
        <div class="char-name">${d.character.name} <span style="font-weight:400;font-size:.8rem;opacity:.6">· ${d.character.role}</span></div>
        <div class="char-quote">«${d.character.intro.substring(0,100)}...»</div>
      </div>
    </div>
  `;
}

function renderSkills(d){
  const grid = document.getElementById('skillsGrid');
  d.skills.forEach((sk,i)=>{
    const pct = +(localStorage.getItem(`ssg_skill_${sk.id}`)||0);
    const card = document.createElement('a');
    card.className='skill-card';
    card.href=`skill.html?id=${sk.id}&district=${d.id}`;
    card.style.cssText=`animation-delay:${i*0.08}s`;

    let badge, badgeClass;
    if(pct===0){badge='Новый';badgeClass='badge-new';}
    else if(pct>=100){badge='✅ Прокачан';badgeClass='badge-done';}
    else{badge='В процессе';badgeClass='badge-progress';}

    card.innerHTML=`
      <div class="sk-top">
        <span class="sk-emoji">${sk.emoji}</span>
        <span class="sk-name">${sk.name}</span>
      </div>
      <div class="sk-desc">${sk.desc}</div>
      <div class="sk-bar-wrap"><div class="sk-bar-fill" style="width:${pct}%;background:${d.color}"></div></div>
      <div class="sk-footer">
        <span class="sk-pct" style="color:${d.color}">${pct}%</span>
        <span class="sk-badge ${badgeClass}">${badge}</span>
      </div>
    `;
    card.addEventListener('mouseenter',()=>{card.style.borderColor=d.color;card.style.background=d.colorLight;});
    card.addEventListener('mouseleave',()=>{card.style.borderColor='rgba(255,255,255,.1)';card.style.background='rgba(255,255,255,.06)';});
    grid.appendChild(card);
  });
}

init();
</script>
</body>
</html>
