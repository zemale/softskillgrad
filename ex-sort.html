<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Сортировка — Softskillград</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .wrap{max-width:560px;margin:0 auto;padding:0 16px 60px;position:relative;z-index:5;}
    .hero{text-align:center;padding:28px 0 22px;}
    .hero .icon{font-size:3rem;display:block;margin-bottom:10px;}
    .hero h1{font-size:1.45rem;font-weight:900;color:var(--text);margin-bottom:6px;}
    .hero p{font-size:.9rem;color:var(--text2);line-height:1.5;margin-bottom:20px;}

    .sort-area{margin-bottom:20px;}
    .sort-label{font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:10px;}

    /* Draggable items */
    .sort-list{display:flex;flex-direction:column;gap:8px;min-height:40px;}
    .sort-item{
      background:var(--card);border:2px solid var(--border);border-radius:14px;
      padding:14px 16px;font-size:.92rem;font-weight:600;color:var(--text);
      cursor:grab;display:flex;align-items:center;gap:12px;
      box-shadow:0 2px 10px var(--shadow);transition:.2s;user-select:none;
      -webkit-user-select:none;
    }
    .sort-item:active{cursor:grabbing;transform:scale(1.02);box-shadow:0 6px 20px var(--shadow2);}
    .sort-item.dragging{opacity:.4;border-style:dashed;}
    .sort-item.over{border-color:var(--sage);background:var(--sage-light);}
    .sort-item.correct{border-color:var(--sage);background:var(--sage-light);color:#3a7a55;cursor:default;}
    .sort-item.wrong{border-color:var(--peach);background:var(--peach-light);color:#b05020;cursor:default;}
    .item-handle{color:var(--text3);font-size:1.1rem;flex-shrink:0;}
    .item-num{width:26px;height:26px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800;color:var(--text3);flex-shrink:0;}
    .item-num.correct-num{background:var(--sage);color:#fff;}
    .item-num.wrong-num{background:var(--peach);color:#fff;}

    /* Check btn */
    .check-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--sage),#5da07a);color:#fff;border:none;border-radius:14px;font-size:1rem;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;transition:.2s;box-shadow:0 4px 14px rgba(122,184,147,.3);margin-bottom:12px;}
    .check-btn:hover{transform:translateY(-1px);}
    .check-btn:disabled{opacity:.4;cursor:default;transform:none;}
    .shuffle-btn{width:100%;padding:11px;background:var(--bg2);border:1.5px solid var(--border);color:var(--text2);border-radius:14px;font-size:.9rem;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;transition:.2s;}
    .shuffle-btn:hover{background:var(--card);}

    /* Result */
    .result-card{background:var(--card);border:1.5px solid var(--border);border-radius:22px;padding:26px;text-align:center;box-shadow:0 4px 24px var(--shadow);animation:popIn .5s ease;margin-bottom:20px;}
    .result-icon{font-size:3.5rem;display:block;margin-bottom:12px;}
    .result-score{font-size:1.8rem;font-weight:900;color:var(--sage);margin-bottom:8px;}
    .result-text{font-size:.93rem;color:var(--text2);line-height:1.6;margin-bottom:18px;}
    .result-actions{display:flex;gap:10px;flex-wrap:wrap;}
    .result-actions button,.result-actions a{flex:1;min-width:120px;padding:12px;border-radius:13px;font-size:.9rem;font-weight:800;cursor:pointer;text-align:center;text-decoration:none;font-family:'Nunito',sans-serif;transition:.2s;border:none;}
    .btn-retry{background:linear-gradient(135deg,var(--peach),#e07850);color:#fff;}
    .btn-back{background:var(--bg2);color:var(--text2);}
    .btn-retry:hover,.btn-back:hover{transform:translateY(-1px);}

    /* Touch feedback */
    .sort-item.touch-drag{opacity:.5;box-shadow:0 8px 24px var(--shadow2);transform:scale(1.03);}
  </style>
</head>
<body>
<div class="bg-deco"><div class="bg-blob blob1"></div><div class="bg-blob blob2"></div><div class="bg-blob blob3"></div></div>

<header>
  <a href="#" class="back-btn" id="backBtn">← Навык</a>
  <span class="header-title">🃏 Расставь по порядку</span>
</header>

<div class="wrap">
  <div class="hero">
    <span class="icon">🃏</span>
    <h1 id="heroTitle">Загрузка...</h1>
    <p id="heroDesc"></p>
  </div>

  <div class="sort-area">
    <div class="sort-label">Перетащи карточки в правильном порядке</div>
    <div class="sort-list" id="sortList"></div>
  </div>

  <button class="check-btn" id="checkBtn" onclick="checkOrder()">Проверить порядок ✓</button>
  <button class="shuffle-btn" onclick="shuffleList()">🔀 Перемешать заново</button>

  <div id="resultBlock" style="display:none;margin-top:20px"></div>
</div>

<script>
const params = new URLSearchParams(location.search);
const skillId = params.get('skill');
const districtId = params.get('district');
let scenario, order=[];

async function init(){
  const [ir,sr] = await Promise.all([fetch('data/interactive.json'),fetch('data/skills.json')]);
  const idata=await ir.json(); const sdata=await sr.json();
  scenario=idata.sort[skillId]||idata.sort['default'];
  let dist; for(const d of sdata.districts){if(d.skills.find(s=>s.id===skillId)){dist=d;break;}}
  document.getElementById('backBtn').href=`skill.html?id=${skillId}&district=${districtId||dist?.id||''}`;
  document.getElementById('heroTitle').textContent=scenario.title;
  document.getElementById('heroDesc').textContent=scenario.desc;
  order=[...scenario.items];
  shuffleArr(order);
  renderList();
}

function shuffleArr(arr){ for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];} }
function shuffleList(){ shuffleArr(order); renderList(); document.getElementById('resultBlock').style.display='none'; document.getElementById('checkBtn').disabled=false; }

function renderList(){
  const list=document.getElementById('sortList');
  list.innerHTML='';
  order.forEach((item,i)=>{
    const el=document.createElement('div');
    el.className='sort-item'; el.dataset.id=item.id; el.draggable=true;
    el.innerHTML=`<span class="item-handle">⠿</span><span class="item-num">${i+1}</span><span>${item.text}</span>`;
    addDragEvents(el);
    addTouchEvents(el);
    list.appendChild(el);
  });
}

// --- Desktop drag & drop ---
let dragSrc=null;
function addDragEvents(el){
  el.addEventListener('dragstart',e=>{dragSrc=el;el.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
  el.addEventListener('dragend',()=>{el.classList.remove('dragging');document.querySelectorAll('.sort-item').forEach(x=>x.classList.remove('over'));});
  el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('over');});
  el.addEventListener('dragleave',()=>el.classList.remove('over'));
  el.addEventListener('drop',e=>{
    e.preventDefault(); el.classList.remove('over');
    if(dragSrc===el) return;
    const list=document.getElementById('sortList');
    const items=[...list.querySelectorAll('.sort-item')];
    const srcIdx=items.indexOf(dragSrc), dstIdx=items.indexOf(el);
    if(srcIdx<dstIdx) el.after(dragSrc); else el.before(dragSrc);
    updateNums();
  });
}

// --- Touch drag & drop ---
let touchDragEl=null, touchClone=null, touchOffX=0, touchOffY=0;
function addTouchEvents(el){
  el.addEventListener('touchstart',e=>{
    touchDragEl=el; el.classList.add('touch-drag');
    const t=e.touches[0], r=el.getBoundingClientRect();
    touchOffX=t.clientX-r.left; touchOffY=t.clientY-r.top;
    touchClone=el.cloneNode(true);
    touchClone.style.cssText=`position:fixed;z-index:999;width:${r.width}px;opacity:.85;pointer-events:none;left:${r.left}px;top:${r.top}px;`;
    document.body.appendChild(touchClone);
  },{passive:true});
  el.addEventListener('touchmove',e=>{
    if(!touchDragEl) return; e.preventDefault();
    const t=e.touches[0];
    touchClone.style.left=(t.clientX-touchOffX)+'px';
    touchClone.style.top=(t.clientY-touchOffY)+'px';
    // highlight target
    document.querySelectorAll('.sort-item').forEach(x=>x.classList.remove('over'));
    const target=document.elementFromPoint(t.clientX,t.clientY)?.closest('.sort-item');
    if(target&&target!==touchDragEl) target.classList.add('over');
  },{passive:false});
  el.addEventListener('touchend',e=>{
    if(!touchDragEl) return;
    touchClone?.remove(); touchClone=null;
    touchDragEl.classList.remove('touch-drag');
    const t=e.changedTouches[0];
    const target=document.elementFromPoint(t.clientX,t.clientY)?.closest('.sort-item');
    if(target&&target!==touchDragEl){
      const list=document.getElementById('sortList');
      const items=[...list.querySelectorAll('.sort-item')];
      const si=items.indexOf(touchDragEl),di=items.indexOf(target);
      if(si<di) target.after(touchDragEl); else target.before(touchDragEl);
      updateNums();
    }
    document.querySelectorAll('.sort-item').forEach(x=>x.classList.remove('over'));
    touchDragEl=null;
  });
}

function updateNums(){
  document.querySelectorAll('#sortList .sort-item').forEach((el,i)=>{
    el.querySelector('.item-num').textContent=i+1;
  });
}

function checkOrder(){
  const list=document.getElementById('sortList');
  const items=[...list.querySelectorAll('.sort-item')];
  const userOrder=items.map(el=>+el.dataset.id);
  let correct=0;
  items.forEach((el,i)=>{
    const numEl=el.querySelector('.item-num');
    if(userOrder[i]===scenario.correct[i]){
      el.classList.add('correct'); el.draggable=false;
      numEl.classList.add('correct-num'); numEl.textContent='✓';
      correct++;
    } else {
      el.classList.add('wrong'); el.draggable=false;
      numEl.classList.add('wrong-num');
    }
  });
  document.getElementById('checkBtn').disabled=true;
  showResult(correct, userOrder.length);
}

function showResult(correct, total){
  const pct=Math.round(correct/total*100);
  let icon,text;
  if(pct===100){icon='🏆';text='Идеально! Ты знаешь правильный порядок на 100%!';}
  else if(pct>=50){icon='👍';text=`${correct} из ${total} шагов правильно. Почти! Посмотри на ошибки и попробуй ещё раз.`;}
  else{icon='💪';text=`${correct} из ${total} — хорошее начало! Изучи правильный порядок и попробуй снова.`;}

  document.getElementById('resultBlock').style.display='block';
  document.getElementById('resultBlock').innerHTML=`<div class="result-card">
    <span class="result-icon">${icon}</span>
    <div class="result-score">${correct} / ${total}</div>
    <div class="result-text">${text}</div>
    <div class="result-actions">
      <button class="btn-retry" onclick="shuffleList()">🔄 Попробовать снова</button>
      <a class="btn-back" href="skill.html?id=${skillId}&district=${districtId}">← К навыку</a>
    </div>
  </div>`;
  if(pct===100){
    const cur=+(localStorage.getItem(`ssg_skill_${skillId}`)||0);
    if(cur<100) localStorage.setItem(`ssg_skill_${skillId}`,Math.min(100,cur+10));
  }
  document.getElementById('resultBlock').scrollIntoView({behavior:'smooth'});
}

init();
</script>
<script src="achievements.js"></script>
</body>
</html>
