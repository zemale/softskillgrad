<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Результат — Softskillград</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .wrap { max-width: 620px; margin: 0 auto; padding: 0 16px 60px; position: relative; z-index: 5; }

    .result-hero { text-align: center; padding: 28px 0 24px; animation: fadeUp .4s ease; }
    .result-hero .icon { font-size: 3.8rem; display: block; margin-bottom: 12px; animation: float 3s ease-in-out infinite; }
    .result-hero h1 { font-size: 1.6rem; font-weight: 900; color: var(--text); margin-bottom: 8px; }
    .result-hero p  { font-size: .93rem; color: var(--text2); line-height: 1.5; }

    /* Radar */
    .radar-wrap { text-align: center; margin: 20px 0; animation: fadeUp .4s .1s ease both; }
    .radar-card {
      display: inline-block; background: var(--card);
      border: 1.5px solid var(--border); border-radius: 22px;
      padding: 20px; box-shadow: 0 4px 20px var(--shadow);
    }

    /* Score bars */
    .scores-card {
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: 20px; padding: 22px;
      box-shadow: 0 4px 18px var(--shadow);
      margin-bottom: 20px; animation: fadeUp .4s .2s ease both;
    }
    .score-item { margin-bottom: 16px; }
    .score-item:last-child { margin-bottom: 0; }
    .sh { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; }
    .sn { font-size: .95rem; font-weight: 800; color: var(--text); display: flex; align-items: center; gap: 8px; }
    .sv { font-size: .95rem; font-weight: 900; }

    /* Recs */
    .recs-section { animation: fadeUp .4s .3s ease both; }
    .rec-card {
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: 18px; padding: 18px;
      margin-bottom: 12px; text-decoration: none; color: var(--text);
      display: flex; align-items: center; gap: 14px;
      box-shadow: 0 3px 14px var(--shadow); transition: .2s;
    }
    .rec-card:hover { transform: translateY(-2px); box-shadow: 0 6px 24px var(--shadow2); }
    .rc-emoji { font-size: 2rem; flex-shrink: 0; }
    .rc-info { flex: 1; }
    .rc-name { font-size: 1rem; font-weight: 900; color: var(--text); }
    .rc-dist { font-size: .78rem; font-weight: 700; margin-top: 2px; }
    .rc-why  { font-size: .83rem; color: var(--text2); line-height: 1.4; margin-top: 4px; }
    .rc-arrow { font-size: 1.1rem; color: var(--text3); }
  </style>
</head>
<body>

<div class="bg-deco">
  <div class="bg-blob blob1"></div>
  <div class="bg-blob blob2"></div>
  <div class="bg-blob blob3"></div>
</div>

<header>
  <a href="index.html" class="back-btn">← Главная</a>
  <span class="header-title">Твои результаты</span>
</header>

<div class="wrap">
  <div class="result-hero">
    <span class="icon">🎯</span>
    <h1>Твои Soft Skills</h1>
    <p id="summary"></p>
  </div>

  <div class="radar-wrap">
    <div class="radar-card">
      <canvas id="radar" width="260" height="260"></canvas>
    </div>
  </div>

  <div class="scores-card">
    <div class="section-label" style="margin-bottom:16px">Баллы по группам</div>
    <div id="scoreBars"></div>
  </div>

  <div class="recs-section">
    <div class="section-label" style="margin-bottom:14px">С чего начать</div>
    <div id="recsList"></div>
  </div>

  <a href="test.html" class="btn-ghost" style="display:block;text-align:center;margin-top:20px">🔄 Пройти тест заново</a>
</div>

<script>
const GROUPS = {
  communication:{ name:'Коммуникация', emoji:'🎤', color:'#f4956a', light:'#fde9dc', max:20 },
  leadership:   { name:'Лидерство',    emoji:'👑', color:'#7ab893', light:'#e8f5ee', max:20 },
  creative:     { name:'Креатив',      emoji:'🎨', color:'#b8a9d9', light:'#ece8f8', max:20 },
  personal:     { name:'Личность',     emoji:'🧠', color:'#7ec8e3', light:'#dff2fa', max:20 }
};

async function init(){
  const raw=localStorage.getItem('ssg_test_result');
  if(!raw){location.href='test.html';return;}
  const scores=JSON.parse(raw);
  const pcts={};
  Object.keys(GROUPS).forEach(k=>{ pcts[k]=Math.min(100,Math.round((scores[k]||0)/GROUPS[k].max*100)); });
  drawRadar(pcts);
  renderBars(pcts);
  renderRecs(pcts);
  renderSummary(pcts);
}

function renderSummary(pcts){
  const sorted=Object.entries(pcts).sort((a,b)=>b[1]-a[1]);
  const top=GROUPS[sorted[0][0]], low=GROUPS[sorted[sorted.length-1][0]];
  document.getElementById('summary').textContent=`Твоя сила — ${top.name}. Есть куда расти в ${low.name}.`;
}

function renderBars(pcts){
  const wrap=document.getElementById('scoreBars');
  Object.entries(pcts).sort((a,b)=>b[1]-a[1]).forEach(([k,pct])=>{
    const g=GROUPS[k];
    const div=document.createElement('div'); div.className='score-item';
    div.innerHTML=`
      <div class="sh">
        <span class="sn">${g.emoji} ${g.name}</span>
        <span class="sv" style="color:${g.color}">${pct}%</span>
      </div>
      <div class="pbar-wrap"><div class="pbar-fill" style="width:0%;background:${g.color}" data-w="${pct}"></div></div>
    `;
    wrap.appendChild(div);
    setTimeout(()=>div.querySelector('.pbar-fill').style.width=pct+'%',100);
  });
}

function renderRecs(pcts){
  const wrap=document.getElementById('recsList');
  Object.entries(pcts).sort((a,b)=>a[1]-b[1]).slice(0,3).forEach(([k,pct])=>{
    const g=GROUPS[k];
    const why=pct<40?'Большой потенциал для роста!':pct<70?'Хорошая база — можно больше.':'Ты уже силён, но совершенству нет предела!';
    const card=document.createElement('a');
    card.className='rec-card'; card.href=`district.html?id=${k}`;
    card.style.borderColor=g.color+'44';
    card.innerHTML=`
      <span class="rc-emoji">${g.emoji}</span>
      <div class="rc-info">
        <div class="rc-name">${g.name}</div>
        <div class="rc-dist" style="color:${g.color}">${pct}% прокачано</div>
        <div class="rc-why">${why}</div>
      </div>
      <span class="rc-arrow">→</span>
    `;
    wrap.appendChild(card);
  });
}

function drawRadar(pcts){
  const canvas=document.getElementById('radar');
  const ctx=canvas.getContext('2d');
  const cx=130,cy=130,r=95;
  const keys=['communication','leadership','creative','personal'];
  const labels=['🎤','👑','🎨','🧠'];
  const colors=['#f4956a','#7ab893','#b8a9d9','#7ec8e3'];
  const angles=keys.map((_,i)=>-Math.PI/2+i*Math.PI*2/keys.length);

  // Grid lines
  for(let g=1;g<=4;g++){
    ctx.beginPath();
    angles.forEach((a,i)=>{
      const x=cx+Math.cos(a)*r*g/4, y=cy+Math.sin(a)*r*g/4;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    });
    ctx.closePath();
    ctx.strokeStyle='rgba(44,62,53,.08)'; ctx.lineWidth=1; ctx.stroke();
  }
  // Axes
  angles.forEach(a=>{
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.cos(a)*r, cy+Math.sin(a)*r);
    ctx.strokeStyle='rgba(44,62,53,.1)'; ctx.stroke();
  });
  // Data
  ctx.beginPath();
  angles.forEach((a,i)=>{
    const v=(pcts[keys[i]]||0)/100;
    const x=cx+Math.cos(a)*r*v, y=cy+Math.sin(a)*r*v;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });
  ctx.closePath();
  ctx.fillStyle='rgba(122,184,147,.2)'; ctx.fill();
  ctx.strokeStyle='#7ab893'; ctx.lineWidth=2; ctx.stroke();
  // Points
  angles.forEach((a,i)=>{
    const v=(pcts[keys[i]]||0)/100;
    ctx.beginPath();
    ctx.arc(cx+Math.cos(a)*r*v, cy+Math.sin(a)*r*v, 5,0,Math.PI*2);
    ctx.fillStyle=colors[i]; ctx.fill();
  });
  // Labels
  ctx.font='bold 20px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  angles.forEach((a,i)=>{
    ctx.fillText(labels[i], cx+Math.cos(a)*(r+20), cy+Math.sin(a)*(r+20));
  });
}

init();
</script>
</body>
</html>
