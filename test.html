<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Тест — Softskillград</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .wrap { max-width: 580px; margin: 0 auto; padding: 0 16px 60px; position: relative; z-index: 5; }

    .intro { text-align: center; padding: 40px 0 32px; animation: fadeUp .5s ease; }
    .intro .icon { font-size: 4rem; display: block; margin-bottom: 14px; animation: float 3s ease-in-out infinite; }
    .intro h1 { font-size: 1.7rem; font-weight: 900; color: var(--text); margin-bottom: 10px; }
    .intro p  { font-size: .95rem; color: var(--text2); line-height: 1.6; margin-bottom: 28px; max-width: 380px; margin-left: auto; margin-right: auto; }

    .stats-row { display: flex; gap: 12px; justify-content: center; margin-bottom: 28px; flex-wrap: wrap; }
    .stat-chip {
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: 14px; padding: 10px 18px; text-align: center;
      box-shadow: 0 2px 10px var(--shadow);
    }
    .stat-chip .num { font-size: 1.3rem; font-weight: 900; color: var(--sage); }
    .stat-chip .lbl { font-size: .72rem; color: var(--text3); margin-top: 2px; }

    .pbar-section { margin-bottom: 20px; }
    .pbar-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .pbar-lbl { font-size: .8rem; font-weight: 700; color: var(--text3); }
    .pbar-num { font-size: .9rem; font-weight: 900; color: var(--peach); }

    .question-card {
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: 20px; padding: 24px;
      box-shadow: 0 4px 20px var(--shadow);
      animation: fadeUp .35s ease;
    }
    .q-group-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: .75rem; font-weight: 800; padding: 4px 12px;
      border-radius: 10px; margin-bottom: 12px;
    }
    .q-num  { font-size: .78rem; color: var(--text3); font-weight: 700; margin-bottom: 10px; }
    .q-text { font-size: 1.05rem; font-weight: 700; color: var(--text); line-height: 1.5; margin-bottom: 18px; }
    .q-opts { display: flex; flex-direction: column; gap: 10px; }
  </style>
</head>
<body>

<div class="bg-deco">
  <div class="bg-blob blob1"></div>
  <div class="bg-blob blob2"></div>
  <div class="bg-blob blob3"></div>
</div>

<header>
  <a href="index.html" class="back-btn">← Главная</a>
  <span class="header-title">🧠 Тест «Твои Soft Skills»</span>
</header>

<div class="wrap">
  <div class="intro" id="introView">
    <span class="icon">🎯</span>
    <h1>Узнай свои<br>Soft Skills</h1>
    <p>20 вопросов — около 5 минут.<br>Узнаешь свои сильные стороны и с чего начать.</p>
    <div class="stats-row">
      <div class="stat-chip"><div class="num">20</div><div class="lbl">вопросов</div></div>
      <div class="stat-chip"><div class="num">4</div><div class="lbl">группы навыков</div></div>
      <div class="stat-chip"><div class="num">5 мин</div><div class="lbl">примерно</div></div>
    </div>
    <button class="btn-peach" style="font-size:1rem;padding:14px 36px" onclick="startTest()">Начать тест →</button>
  </div>

  <div id="testView" style="display:none">
    <div class="pbar-section">
      <div class="pbar-top">
        <span class="pbar-lbl">Прогресс</span>
        <span class="pbar-num" id="qNum">0 / 20</span>
      </div>
      <div class="pbar-wrap"><div class="pbar-fill" id="testBar" style="width:0%;background:linear-gradient(90deg,var(--sage),var(--peach))"></div></div>
    </div>
    <div id="qWrap"></div>
  </div>
</div>

<script>
const GROUP_META = {
  communication:{ label:'Коммуникация', emoji:'🎤', bg:'var(--peach-light)', color:'#b05020' },
  leadership:   { label:'Лидерство',    emoji:'👑', bg:'var(--sage-light)',  color:'#3a7a55' },
  creative:     { label:'Креатив',      emoji:'🎨', bg:'var(--lav-light)',   color:'#5a4090' },
  personal:     { label:'Личность',     emoji:'🧠', bg:'var(--sky-light)',   color:'#20607a' }
};

let questions=[], current=0, scores={communication:0,leadership:0,creative:0,personal:0};

async function startTest(){
  const res=await fetch('data/test.json');
  const data=await res.json();
  questions=data.questions;
  document.getElementById('introView').style.display='none';
  document.getElementById('testView').style.display='block';
  render();
}

function render(){
  if(current>=questions.length){finish();return;}
  const q=questions[current];
  const pct=Math.round(current/questions.length*100);
  document.getElementById('testBar').style.width=pct+'%';
  document.getElementById('qNum').textContent=`${current+1} / ${questions.length}`;

  const gm=GROUP_META[q.group];
  document.getElementById('qWrap').innerHTML=`<div class="question-card">
    <div class="q-group-badge" style="background:${gm.bg};color:${gm.color}">${gm.emoji} ${gm.label}</div>
    <div class="q-num">Вопрос ${current+1} из ${questions.length}</div>
    <div class="q-text">${q.text}</div>
    <div class="q-opts">
      ${q.options.map((o,i)=>`<button class="opt-btn" onclick="pick(${i})">${o.text}</button>`).join('')}
    </div>
  </div>`;
}

function pick(i){
  const q=questions[current];
  scores[q.group]=(scores[q.group]||0)+q.options[i].score;
  document.querySelectorAll('.q-opt, .opt-btn')[i].classList.add('correct');
  setTimeout(()=>{current++;render();},280);
}

function finish(){
  localStorage.setItem('ssg_test_done','1');
  localStorage.setItem('ssg_test_result',JSON.stringify(scores));
  location.href='result.html';
}
</script>
<script src="achievements.js"></script>
</body>
</html>
